<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splatfest Versus - Splatoon Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Splatoon:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #222222;
            background-image: url('backgraund.png');
            background-repeat: repeat;
            background-size: 1080px;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 30px;
            gap: 15px;
            font-size: 2rem;
            font-weight: 900;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
        }

        header img {
            height: 40px;
            width: auto;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.5));
        }

        .main-container {
            position: relative;
            max-width: 1400px;
            width: 100%;
            margin: 10px auto 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 600px;
        }

        /* Personajes a los lados */
        .character {
            position: absolute;
            bottom: 0;
            height: 520px;
            z-index: 2;
            object-fit: contain;
        }
        .character-left {
            left: 5%;
        }
        .character-right {
            right: 5%;
        }

        /* Contenedor central de tarjetas */
        .cards-wrapper {
            display: flex;
            flex-direction: column;
            gap: 30px;
            z-index: 3;
            width: 580px;
            max-width: 95%;
        }

        /* Estilo base de Tarjeta Splat Card */
        .splat-card {
            border-radius: 26px;
            padding: 24px 22px 18px 22px;
            position: relative;
            box-shadow: 0 14px 35px rgba(0,0,0,0.7);
            border: 3px solid rgba(0,0,0,0.35);
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Agujero de suspensión superior (Hanger hole) */
        .hanger-hole {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 75px;
            height: 11px;
            background-color: #2a2a2a;
            border-radius: 20px;
            z-index: 10;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.9);
        }
        .hanger-hole::before {
            content: '';
            position: absolute;
            bottom: 9px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 6px;
            background-color: #2a2a2a;
            border-radius: 12px 12px 0 0;
            box-shadow: inset 0 3px 3px rgba(0,0,0,0.9);
        }

        /* Título Estilo Splatoon (Blanco con borde/sombra gruesa) */
        .splat-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: none;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.7), -1px -1px 0px rgba(0,0,0,0.7);
            margin: 10px 0 12px 0;
            letter-spacing: 0.5px;
        }

        /* --- TARJETA DE FESTIVAL (Gris/Marrón oscuro con manchas y cilindro de pregunta) --- */
        .card-festival {
            background-color: #7b716d;
            background-image: radial-gradient(circle at 20% 30%, rgba(60, 50, 45, 0.4) 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(60, 50, 45, 0.4) 0%, transparent 45%);
            transform: rotate(-0.8deg);
        }

        /* Barra cilíndrica translúcida para la pregunta */
        .question-cylinder {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 30px;
            padding: 10px 20px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            margin-bottom: 16px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* Contenedor de los 2 equipos con ilustraciones */
        .teams-columns-2 {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .team-panel-2 {
            flex: 1;
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.25);
        }

        .panel-pink {
            background-color: #2389e0;
        }
        .panel-cyan {
            background-color: #f4511e;
        }

        .team-art {
            width: 100%;
            height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.4));
            margin-bottom: 8px;
        }

        .team-label-box {
            background: #ffffff;
            color: #111;
            width: 90%;
            padding: 8px 0;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid rgba(0,0,0,0.1);
        }

        .date-festival {
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffea00;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.9);
            margin-top: 6px;
            letter-spacing: 0.5px;
        }


        /* --- TARJETA DE RESULTADOS (Marrón con patrón de manchas exacto a la foto) --- */
        .card-results {
            background-color: #a8461f;
            background-image: radial-gradient(circle at 15% 20%, rgba(90, 30, 10, 0.5) 0%, transparent 35%),
                              radial-gradient(circle at 85% 80%, rgba(90, 30, 10, 0.5) 0%, transparent 40%);
            transform: rotate(0.6deg);
            padding-bottom: 20px;
        }

        /* Fila de iconos superiores de equipo para resultados (2 equipos) */
        .results-icons-row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 12px;
            padding-right: 12px;
        }

        .team-badge-icon {
            width: 75px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            overflow: hidden;
            background-color: #333;
        }
        .badge-pink { background-color: #2389e0; }
        .badge-cyan { background-color: #f4511e; }

        .team-badge-icon img {
            height: 28px;
            width: auto;
            object-fit: contain;
        }

        /* Tabla de resultados adaptada a exactamente 2 listas/estadísticas */
        .results-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .results-table td {
            padding: 8px 12px;
            font-weight: bold;
            font-size: 1.05rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }

        .row-title {
            width: 42%;
            text-align: left;
            color: #ffffff;
            font-size: 1.05rem;
            padding-left: 5px;
        }

        .stat-pill {
            background-color: rgba(0, 0, 0, 0.45);
            text-align: center;
            border-radius: 20px;
            width: 29%;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            color: #ffffff;
        }

        .winning-stat {
            color: #d4ff00 !important;
            text-shadow: 0 0 8px rgba(212, 255, 0, 0.6), 1px 1px 2px rgba(0,0,0,0.8);
        }

        .results-winner-footer {
            text-align: center;
            margin-top: 10px;
            font-weight: 900;
            font-style: italic;
            color: #ffea00;
            font-size: 1.35rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.9);
            letter-spacing: 0.5px;
        }

        @media(max-width: 900px) {
            .character {
                display: none;
            }
            .cards-wrapper {
                width: 100%;
                max-width: 95%;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="splatfest.png" alt="Splatfest Icon">
        NEXTENDO NETWORK / SPLATFEST
    </header>

    <div class="main-container">
        <img src="perla.png" class="character character-left" alt="Personaje Izquierda">

        <div class="cards-wrapper">
            
            <!-- TARJETA 1: FESTIVAL -->
            <div class="splat-card card-festival">
                <div class="hanger-hole"></div>
                <div class="splat-title">Festival</div>
                
                <div class="question-cylinder">
                    ¿Qué valoras más en combate?
                </div>

                <div class="teams-columns-2">
                    <div class="team-panel-2 panel-pink">
                        <img src="team_velocidad.png" class="team-art" alt="Velocidad">
                        <div class="team-label-box">Velocidad</div>
                    </div>
                    <div class="team-panel-2 panel-cyan">
                        <img src="team_potencia.png" class="team-art" alt="Potencia">
                        <div class="team-label-box">Potencia</div>
                    </div>
                </div>

                <div class="date-festival">vie, 10/7, 18:00 - dom, 12/7, 18:00</div>
            </div>

            <!-- TARJETA 2: RESULTADOS (2 listas exactas) -->
            <div class="splat-card card-results">
                <div class="hanger-hole"></div>
                <div class="splat-title">Resultados</div>

                <div class="results-icons-row">
                    <div class="team-badge-icon badge-pink">
                        <img src="icon_team1.png" alt="Equipo 1">
                    </div>
                    <div class="team-badge-icon badge-cyan">
                        <img src="icon_team2.png" alt="Equipo 2">
                    </div>
                </div>

                <table class="results-table">
                    <tr>
                        <td class="row-title">Votos</td>
                        <td class="stat-pill winning-stat">52.40%</td>
                        <td class="stat-pill">47.60%</td>
                    </tr>
                    <tr>
                        <td class="row-title">Combate</td>
                        <td class="stat-pill">48.90%</td>
                        <td class="stat-pill winning-stat">51.10%</td>
                    </tr>
                </table>

                <div class="results-winner-footer">¡Victoria de Potencia!</div>
            </div>

        </div>

        <img src="marina.png" class="character character-right" alt="Personaje Derecha">
    </div>

</body>
</html>
