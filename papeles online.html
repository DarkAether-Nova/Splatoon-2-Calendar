<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splatoon 2 Nextendo</title>
    <style>
        @font-face {
            font-family: 'Splatfont2';
            src: url('BlitzBold.otf') format('opentype');
        }
        @font-face {
            font-family: 'SplatfontMain';
            src: url('Splatfont2.ttf') format('truetype');
        }

        :root {
            --bg-dark: #222222;
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image: url('backgraund.png');
            background-repeat: repeat;
            background-size: 1080px;
            background-attachment: scroll;
            font-family: 'SplatfontMain', 'Splatfont2', Arial, sans-serif;
            color: var(--text-white);
            overflow-x: hidden;
        }

        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #222222;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #fff;
            font-size: 1.5rem;
            transition: opacity 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            flex-wrap: wrap;
            gap: 15px;
            background: transparent;
            border-bottom: none;
        }

        .header-left h1 {
            font-family: 'Splatfont2', sans-serif;
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-buttons-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Splatfont2', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.6);
        }

        #languageSelect { display: none !important; }

        .lang-selector { position: relative; }
        .lang-btn {
            display: flex; align-items: center; gap: 8px;
            background: rgba(0,0,0,0.4);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.2);
            padding: 8px 14px;
            border-radius: 20px;
            font-family: 'Splatfont2', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background .2s, border-color .2s;
        }
        .lang-btn:hover { background: rgba(0,0,0,0.6); border-color: rgba(255,255,255,0.4); }
        .lang-btn-globe { font-size: 1rem; line-height: 1; }
        .lang-btn-label { min-width: 68px; text-align: left; }
        .lang-btn-caret { font-size: 0.75rem; opacity: .8; transition: transform .2s; }
        .lang-selector.open .lang-btn { border-color: #ff7a1f; background: rgba(0,0,0,0.6); }
        .lang-selector.open .lang-btn-caret { transform: rotate(180deg); }
        .lang-menu {
            position: absolute; top: calc(100% + 8px); right: 0;
            min-width: 100%; margin: 0; padding: 6px;
            list-style: none;
            background: #191a2c;
            border: 2px solid rgba(255,255,255,0.14);
            border-radius: 14px;
            box-shadow: 0 14px 34px rgba(0,0,0,0.6);
            opacity: 0; visibility: hidden; transform: translateY(-6px);
            transition: opacity .15s ease, transform .15s ease, visibility .15s;
            z-index: 1000;
        }
        .lang-selector.open .lang-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .lang-menu li {
            font-family: 'Splatfont2', sans-serif;
            font-size: 0.95rem;
            color: #cfd3e6;
            padding: 9px 16px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .12s, color .12s;
        }
        .lang-menu li:hover { background: rgba(255,122,31,0.18); color: #fff; }
        .lang-menu li[aria-selected="true"] {
            background: linear-gradient(90deg, #ff7a1f, #ff5c9a);
            color: #fff;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.25);
        }

        .main-container {
            max-width: 1600px;
            margin: 20px auto 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .paper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            justify-content: center;
        }

        .paper-sheet {
            background: #fdfdfd;
            color: #111;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 5px 15px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: 'SplatfontMain', Arial, sans-serif;
            border: 1px solid #ccc;
        }

        .paper-sheet.no-room {
            background: #dcdcdc !important;
            filter: grayscale(30%);
        }

        .paper-sheet.no-room .paper-content,
        .paper-sheet.no-room .tear-off-section {
            opacity: 0.25;
            pointer-events: none;
        }

        .no-room-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(220, 220, 220, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .paper-sheet.no-room .no-room-overlay {
            display: flex;
        }

        .no-room-badge {
            font-family: 'Splatfont2', sans-serif;
            font-size: 2rem;
            color: #d9534f;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border: 3px dashed #d9534f;
            border-radius: 8px;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: rotate(-5deg);
        }

        .paper-sheet:nth-child(4n+1) { transform: rotate(-1deg); }
        .paper-sheet:nth-child(4n+2) { transform: rotate(1.2deg); }
        .paper-sheet:nth-child(4n+3) { transform: rotate(-0.5deg); }
        .paper-sheet:nth-child(4n+4) { transform: rotate(0.8deg); }

        .paper-sheet::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 30px;
            width: 70px;
            height: 25px;
            background: rgba(230, 225, 200, 0.65);
            border-left: 2px dashed rgba(0,0,0,0.1);
            border-right: 2px dashed rgba(0,0,0,0.1);
            transform: rotate(-3deg);
            z-index: 10;
        }
        .paper-sheet::after {
            content: '';
            position: absolute;
            top: -8px;
            right: 35px;
            width: 65px;
            height: 24px;
            background: rgba(230, 225, 200, 0.65);
            border-left: 2px dashed rgba(0,0,0,0.1);
            border-right: 2px dashed rgba(0,0,0,0.1);
            transform: rotate(4deg);
            z-index: 10;
        }

        .paper-header {
            padding: 18px 20px 10px 20px;
            background: #f4f4f4;
            border-bottom: 2px dashed #ddd;
        }

/* Hace que la imagen sea invisible si no tiene un src asignado o está vacío */
.paper-map-img:not([src]), 
.paper-map-img[src=""] {
    opacity: 0;
}

/* Opcional: añade un pequeño efecto de desvanecimiento cuando la imagen por fin carga */
.paper-map-img {
    transition: opacity 0.3s ease-in;
}

        .paper-title {
            font-family: 'Splatfont2', sans-serif;
            font-size: 1.3rem;
            color: #111;
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .paper-mode-badge {
            font-size: 0.9rem;
            color: #555;
            background: #e5e5e5;
            padding: 3px 10px;
            border-radius: 12px;
            display: inline-block;
            font-weight: bold;
        }

        .paper-content {
            padding: 15px 20px;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .paper-maps-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .paper-map-box {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: #111;
            border: 2px solid #ddd;
        }

        .paper-map-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: zoom-in;
        }

        .paper-map-name {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin: 0;
            white-space: nowrap;
        }

        .paper-info-row {
            font-size: 0.95rem;
            color: #333;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }

        .match-timer {
            color: #d9534f;
            font-family: 'Splatfont2', sans-serif;
            font-size: 0.9rem;
            background: #ffecec;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .tear-off-section {
            border-top: 2px dashed #bbb;
            background: #fafafa;
            padding: 12px 0 0 0;
            margin-top: auto;
        }

        .tear-off-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            text-align: center;
            color: #777;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .tear-strips-container {
            display: flex;
            width: 100%;
            height: 110px;
            border-top: 1px dashed #ccc;
        }

        .tear-strip {
            flex: 1;
            border-right: 1px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 3px;
            background: #fff;
            transition: background 0.2s;
        }

.tear-strip.disconnected {
            background: transparent;
            border-top: none;
            border-bottom: none;
            /* Mantiene solo la línea divisoria derecha para que no se descuadre */
            border-left: none;
            border-right: 1px dashed #ccc; 
        }

        .tear-strip:last-child {
            border-right: none;
        }

        .tear-strip span {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.8rem;
            font-weight: 900;
            color: #000000;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .tear-strip.disconnected span {
            visibility: hidden;
        }

        .salmon-sheet-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .salmon-weapons-grid {
            display: flex;
            gap: 6px;
            justify-content: space-between;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 6px;
        }

        .salmon-sheet-wep {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background: #fff;
            border-radius: 50%;
            padding: 3px;
            border: 1px solid #ddd;
        }

        .nx-footer {
            max-width: 1600px;
            margin: 40px auto 20px;
            padding: 22px 24px;
            border-top: 2px solid rgba(255,255,255,0.12);
            text-align: center;
            color: rgba(255,255,255,0.55);
            line-height: 1.55;
        }
        .nx-footer-disc { max-width: 820px; margin: 0 auto 10px; font-size: 0.82rem; }
        .nx-footer-credit { margin: 6px 0; font-size: 0.95rem; }
        .nx-footer-credit strong { color: #fff; }
        .nx-footer-links {
            margin-top: 10px;
            display: flex; gap: 12px;
            justify-content: center; align-items: center;
            flex-wrap: wrap; font-weight: bold; font-size: 1rem;
        }
        .nx-footer a { color: #ff7a1f; text-decoration: none; }
        .nx-footer a:hover { text-decoration: underline; }
        .nx-footer-links span { opacity: 0.4; }

        #imgLightbox {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.88); z-index: 9999;
            justify-content: center; align-items: center; flex-direction: column;
            cursor: zoom-out;
        }
        #imgLightbox.open { display: flex; }
        #imgLightboxImg {
            width: min(90vw, 1000px); height: auto; max-height: 80vh;
            object-fit: contain; border-radius: 12px;
            box-shadow: 0 14px 50px rgba(0,0,0,0.75);
            border: 3px solid rgba(255,255,255,0.15);
        }
        #imgLightboxCap {
            margin-top: 20px; font-family: 'Splatfont2', sans-serif;
            color: #fff; font-size: 1.6rem; text-shadow: 0 2px 6px rgba(0,0,0,0.85);
        }
    </style>
</head>

        function getCurrentLang() {

            if (savedRoomState !== null) return savedRoomState;
            let isNoRoom = Math.random() < 0.25;
            localStorage.setItem(storageKey + '_noroom', JSON.stringify(isNoRoom));
            return isNoRoom;
        }

        function generateTearStrips(totalSlots, storageKey) {
            let savedData = JSON.parse(localStorage.getItem(storageKey));
            if (savedData && Array.isArray(savedData)) {
                let html = '';
                for (let i = 0; i < totalSlots; i++) {
                    if (savedData[i].disconnected) {
                        html += `<div class="tear-strip disconnected"><span>-</span></div>`;
                    } else {
                        html += `<div class="tear-strip"><span>${savedData[i].name}</span></div>`;
                    }
                }
                return html;
            }

            let shuffled = [...playerNamesPool].sort(() => Math.random() - 0.5);
            let selected = shuffled.slice(0, totalSlots);
            let dcCount = Math.floor(Math.random() * 2) + 1; 
            let dcIndices = [];
            while(dcIndices.length < dcCount) {
                let idx = Math.floor(Math.random() * totalSlots);
                if(!dcIndices.includes(idx)) dcIndices.push(idx);
            }

            let stripData = [];
            let html = '';
            for(let i = 0; i < totalSlots; i++) {
                if(dcIndices.includes(i)) {
                    stripData.push({ disconnected: true, name: '' });
                    html += `<div class="tear-strip disconnected"><span>-</span></div>`;
                } else {
                    let playerName = selected.pop();
                    stripData.push({ disconnected: false, name: playerName });
                    html += `<div class="tear-strip"><span>${playerName}</span></div>`;
                }
            }

            localStorage.setItem(storageKey, JSON.stringify(stripData));
            return html;
        }

        function getFormattedCurrentTime() {
            let savedTime = localStorage.getItem('nextendo_timer_val');
            let savedTimestamp = localStorage.getItem('nextendo_timestamp');
            let now = Date.now();
            let currentSeconds = 180;

            if (savedTime && savedTimestamp) {
                let elapsedSeconds = Math.floor((now - parseInt(savedTimestamp)) / 1000);
                currentSeconds = parseInt(savedTime) - elapsedSeconds;

                if (currentSeconds <= 0) {
                    let totalSecondsPassed = elapsedSeconds;
                    currentSeconds = 180 - (totalSecondsPassed % 180);
                    refreshAllPlayers(true);
                }
            } else {
                localStorage.setItem('nextendo_timestamp', now);
                localStorage.setItem('nextendo_timer_val', 180);
            }

            let m = Math.floor(currentSeconds / 60);
            let s = currentSeconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        let matchSeconds = getPersistentSeconds();

        function getPersistentSeconds() {
            let savedTime = localStorage.getItem('nextendo_timer_val');
            let savedTimestamp = localStorage.getItem('nextendo_timestamp');
            let now = Date.now();
            let currentSeconds = 180;

            if (savedTime && savedTimestamp) {
                let elapsedSeconds = Math.floor((now - parseInt(savedTimestamp)) / 1000);
                currentSeconds = parseInt(savedTime) - elapsedSeconds;
                if (currentSeconds <= 0) {
                    currentSeconds = 180 - (elapsedSeconds % 180);
                    refreshAllPlayers(true);
                }
            } else {
                localStorage.setItem('nextendo_timestamp', now);
                localStorage.setItem('nextendo_timer_val', 180);
            }
            return currentSeconds;
        }

        setInterval(() => {
            matchSeconds--;
            if (matchSeconds < 0) {
                matchSeconds = 180;
                refreshAllPlayers(true);
            }

            localStorage.setItem('nextendo_timer_val', matchSeconds);
            localStorage.setItem('nextendo_timestamp', Date.now());

            let m = Math.floor(matchSeconds / 60);
            let s = matchSeconds % 60;
            let timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

            for (let mode of ['f', 'r', 'l']) {
                for (let i = 1; i <= 4; i++) {
                    let timerEl = document.getElementById(`${mode}${i}-timer`);
                    if (timerEl) timerEl.textContent = timeStr;
                }
            }
            for (let i = 1; i <= 4; i++) {
                let timerEl = document.getElementById(`s${i}-timer`);
                if (timerEl) timerEl.textContent = timeStr;
            }
        }, 1000);

function changeLanguage() {
    var sel = document.getElementById('languageSelect');
    if (!sel) return;

    var lang = sel.value;
    localStorage.setItem('nextendo_lang', lang);
    
    var label = document.getElementById('langBtnLabel');
    if (label) {
        var opt = sel.options[sel.selectedIndex];
        if (opt) label.textContent = opt.text;
    }

    var menu = document.getElementById('langMenu');
    if (menu) {
        menu.querySelectorAll('li').forEach(function(li){
            if (li.dataset.lang === lang) li.setAttribute('aria-selected', 'true');
            else li.removeAttribute('aria-selected');
        });
    }

    updateStaticTexts();

    if (typeof loadRotations === 'function') loadRotations();
    if (typeof loadSalmonRotations === 'function') loadSalmonRotations();

    setTimeout(() => {
        updateStaticTexts();
    }, 100);
}

            const caption = document.getElementById('imgLightboxCap');
            if (box && img) {
                img.src = src;
                if (caption) caption.textContent = cap || '';
                box.classList.add('open');
            }

        };

    <script>
        (function () {
            var wrap = document.getElementById('langSelector');
            var sel = document.getElementById('languageSelect');
            var btn = document.getElementById('langBtn');
            var menu = document.getElementById('langMenu');
            if (!wrap || !sel || !btn || !menu) return;
            function close() { wrap.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                var open = wrap.classList.toggle('open');
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
            menu.addEventListener('click', function (e) {
                var li = e.target.closest('li[data-lang]');
                if (!li) return;
                sel.value = li.dataset.lang;
                changeLanguage();
                close();
            });
            document.addEventListener('click', function (e) { if (!wrap.contains(e.target)) close(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
        })();
    </script>

    <div id="imgLightbox" onclick="closeImgLightbox()">

        <div id="imgLightboxCap"></div>
